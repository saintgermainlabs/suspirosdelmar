version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: suspiros_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suspiros_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-suspiros_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suspiros_admin} -d ${POSTGRES_DB:-suspiros_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: suspiros_evolution_api
    restart: always
    environment:
      - SERVER_URL=https://${EVOLUTION_DOMAIN}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://${POSTGRES_USER:-suspiros_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-suspiros_db}?schema=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  evolution_instances:
