version: '3.8'

services:
  # 1. Primary PostgreSQL Database (Serving n8n, Evolution API, and all websites)
  postgres:
    image: postgres:16-alpine
    container_name: shared_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-master_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-shared_backend_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multi-db.sql:/docker-entrypoint-initdb.d/init-multi-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-master_admin} -d ${POSTGRES_DB:-shared_backend_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: shared_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-shared_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-shared_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Central n8n Automation Engine
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: shared_n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-shared_backend_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-master_admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_DOMAIN}
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - GENERIC_TIMEZONE=America/Bogota
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Universal WhatsApp Gateway (Official Image: evoapicloud/evolution-api)
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: shared_evolution_api
    restart: always
    environment:
      - SERVER_URL=https://${EVOLUTION_DOMAIN}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://${POSTGRES_USER:-master_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shared_backend_db}?schema=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  # 5. Database Management Web UI (Adminer)
  db-admin:
    image: adminer:latest
    container_name: shared_db_admin
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  evolution_instances:
